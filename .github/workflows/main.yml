name: Quest Helper Bot Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: bot-instance
  cancel-in-progress: true

jobs:
  bot-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries, Apktool & Chromium
        run: |
          sudo apt-get update -y
          sudo apt-get install -y apktool unzip curl
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Telegram Bot
        run: |
          python main.py
